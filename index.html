<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Inventory Asset - IDMNC</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #059669;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    .locked-box {
      max-width: 420px;
      margin: 80px auto;
      background: #fff;
      padding: 28px 20px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

    .search-card, .result-card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .input-group { display: flex; gap: 8px; }

    input[type="text"] {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      text-transform: uppercase;
    }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }

    .scan-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-scan { background: #0f172a; color: #fff; font-size: 13px; }
    .btn-photo { background: #334155; color: #fff; font-size: 13px; }

    #reader, #file-reader {
      width: 100%;
      margin-top: 12px;
      border-radius: 10px;
      overflow: hidden;
      display: none;
    }

    .sn-badge {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      font-weight: 700;
      font-size: 14px;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .detail-row:last-of-type { border-bottom: none; }

    .detail-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      min-width: 110px;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 600;
      text-align: right;
      word-break: break-word;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-copy { background: #e2e8f0; color: #0f172a; }
    .btn-share { background: var(--success); color: #fff; }

    .status-msg { text-align: center; padding: 20px; color: var(--muted); font-size: 14px; }
    .error-msg { color: #dc2626; font-weight: 600; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="locked-box" id="lockedScreen" style="display:none;">
    <h2>🔒 Private Access Only</h2>
    <p style="color:#64748b; font-size:14px;">Please use the authorized shared link to view this page.</p>
  </div>

  <div class="container" id="mainApp" style="display:none;">
    <div class="header">
      <h1>Inventory Asset Lookup</h1>
      <p>Scan QR code or enter Serial Number to view details</p>
    </div>

    <div class="search-card">
      <div class="input-group">
        <input type="text" id="snInput" placeholder="e.g. GRO-PHO-001" />
        <button class="btn-primary" onclick="searchItem()">Search</button>
      </div>

      <div class="scan-row">
        <button class="btn-scan" id="scanToggleBtn" onclick="toggleScanner()">📷 Live Camera</button>
        <button class="btn-photo" onclick="document.getElementById('qrFileInput').click()">🖼️ Scan Photo</button>
      </div>

      <input type="file" id="qrFileInput" accept="image/*" style="display:none;" onchange="scanFromFile(event)" />
      <div id="reader"></div>
      <div id="file-reader" style="display:none;"></div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="status-msg" id="statusMsg">Enter or scan a Serial Number above.</div>
      <div id="detailsContainer" style="display:none;">
        <div class="sn-badge" id="badgeSn"></div>
        <div id="rowsList"></div>
        <div class="action-buttons">
          <button class="btn-copy" onclick="copyDetails()">📋 Copy Details</button>
          <button class="btn-share" onclick="shareDetails()">📤 Share</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    // ඔයාගේ Apps Script Web App URL එක මෙතනට දාන්න
    const API_URL = "https://script.google.com/macros/s/AKfycbyTSiah2uFX9CPOP8FnwuVz8ttG3P4Q2CHP0BqOYRXGVJcRnOq2FUEBVkNgHfQcTkrcUQ/exec";

    let accessKey = "";
    let currentFormattedText = "";
    let currentShareUrl = "";
    let html5QrCode = null;
    let isScanning = false;

    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      accessKey = (params.get("k") || "").trim();

      if (!accessKey) {
        document.getElementById("lockedScreen").style.display = "block";
        return;
      }

      document.getElementById("mainApp").style.display = "block";

      const snParam = params.get("sn");
      if (snParam) {
        document.getElementById("snInput").value = snParam;
        searchItem();
      }
    };

    document.getElementById("snInput").addEventListener("keypress", function (e) {
      if (e.key === "Enter") searchItem();
    });

    function handleDecodedText(decodedText) {
      let extractedSn = decodedText.trim();
      if (extractedSn.includes("sn=")) {
        try {
          const urlObj = new URL(extractedSn);
          extractedSn = urlObj.searchParams.get("sn") || extractedSn;
        } catch (_) {}
      }
      document.getElementById("snInput").value = extractedSn;
      searchItem();
    }

    async function searchItem() {
      const sn = document.getElementById("snInput").value.trim();
      if (!sn) return;

      const statusMsg = document.getElementById("statusMsg");
      const detailsContainer = document.getElementById("detailsContainer");

      detailsContainer.style.display = "none";
      statusMsg.style.display = "block";
      statusMsg.className = "status-msg";
      statusMsg.textContent = "Searching...";

      try {
        const url = `${API_URL}?k=${encodeURIComponent(accessKey)}&sn=${encodeURIComponent(sn)}`;
        const response = await fetch(url);
        const res = await response.json();

        if (res.unauthorized) {
          document.getElementById("mainApp").style.display = "none";
          document.getElementById("lockedScreen").style.display = "block";
          return;
        }

        renderResult(res);
      } catch (err) {
        statusMsg.className = "status-msg error-msg";
        statusMsg.textContent = "Failed to load data: " + err.message;
      }
    }

    function renderResult(res) {
      const statusMsg = document.getElementById("statusMsg");
      const detailsContainer = document.getElementById("detailsContainer");

      if (!res || !res.found) {
        detailsContainer.style.display = "none";
        statusMsg.style.display = "block";
        statusMsg.className = "status-msg error-msg";
        statusMsg.textContent = (res && res.message) ? res.message : "Item not found.";
        return;
      }

      statusMsg.style.display = "none";
      detailsContainer.style.display = "block";
      document.getElementById("badgeSn").textContent = res.serialNumber;

      const rowsList = document.getElementById("rowsList");
      rowsList.innerHTML = "";

      const lines = [`*Asset Details: ${res.serialNumber}*`];

      res.details.forEach((item) => {
        const row = document.createElement("div");
        row.className = "detail-row";
        row.innerHTML = `
          <span class="detail-label">${escapeHtml(item.label)}</span>
          <span class="detail-value">${escapeHtml(item.value)}</span>
        `;
        rowsList.appendChild(row);
        lines.push(`${item.label}: ${item.value}`);
      });

      currentFormattedText = lines.join("\n");
      const baseUrl = window.location.href.split("?")[0];
      currentShareUrl = `${baseUrl}?k=${encodeURIComponent(accessKey)}&sn=${encodeURIComponent(res.serialNumber)}`;
    }

    function copyDetails() {
      if (!currentFormattedText) return;
      navigator.clipboard.writeText(currentFormattedText).then(() => {
        showToast("Details copied to clipboard!");
      });
    }

    async function shareDetails() {
      if (!currentFormattedText) return;
      const shareData = {
        title: "Asset Details",
        text: currentFormattedText + "\n\nLink: " + currentShareUrl
      };

      if (navigator.share) {
        try { await navigator.share(shareData); } catch (err) {}
      } else {
        navigator.clipboard.writeText(shareData.text);
        showToast("Details & Link copied! Ready to paste & share.");
      }
    }

    async function toggleScanner() {
      const readerDiv = document.getElementById("reader");
      const btn = document.getElementById("scanToggleBtn");

      if (isScanning && html5QrCode) {
        try { await html5QrCode.stop(); } catch (_) {}
        readerDiv.style.display = "none";
        btn.textContent = "📷 Live Camera";
        isScanning = false;
        return;
      }

      readerDiv.style.display = "block";
      btn.textContent = "✖ Stop";
      isScanning = true;

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => {
          html5QrCode.stop().then(() => {
            readerDiv.style.display = "none";
            btn.textContent = "📷 Live Camera";
            isScanning = false;
            handleDecodedText(decodedText);
          });
        }
      ).catch((err) => {
        readerDiv.style.display = "none";
        btn.textContent = "📷 Live Camera";
        isScanning = false;
        showToast("Camera error: " + err);
      });
    }

    async function scanFromFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const scanner = new Html5Qrcode("file-reader");
      try {
        const decodedText = await scanner.scanFile(file, true);
        handleDecodedText(decodedText);
      } catch (err) {
        showToast("Could not read QR from image.");
      } finally {
        event.target.value = "";
      }
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
